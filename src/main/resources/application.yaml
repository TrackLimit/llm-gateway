spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: postgres

  data:
    redis:
      host: localhost
      port: 6379

gateway:
  jwt:
    secret: ${GATEWAY_JWT_SECRET:dev-only-secret-replace-in-prod-min-32-chars-long}
    access-ttl: PT15M
    refresh-ttl: P7D